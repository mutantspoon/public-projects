<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quill</title>
    <link rel="stylesheet" href="css/themes.css">
    <link rel="stylesheet" href="css/app.css">
</head>
<body data-theme="dark">
    <!-- Toolbar -->
    <div class="toolbar" id="toolbar">
        <!-- Scrollable left area — clips when window is narrow -->
        <div class="toolbar-left">
            <!-- History + Outline: far left -->
            <div class="toolbar-group">
                <button class="toolbar-btn icon-btn" id="btn-recent-panel" data-tooltip="Recent Files">
                    <svg width="16" height="16" viewBox="0 0 16 16"><path fill="currentColor" fill-rule="evenodd" d="M8 1.25a6.75 6.75 0 1 0 0 13.5 6.75 6.75 0 0 0 0-13.5zm.85 3.5a.85.85 0 0 0-1.7 0V8c0 .23.09.44.25.6l2.4 2.4a.85.85 0 1 0 1.2-1.2L8.85 7.65V4.75z"/></svg>
                </button>
                <button class="toolbar-btn icon-btn" id="btn-outline" data-tooltip="Document Outline">
                    <svg width="16" height="16" viewBox="0 0 16 16"><path fill="currentColor" fill-rule="evenodd" d="M3.25 1.5h9.5A1.75 1.75 0 0 1 14.5 3.25v9.5a1.75 1.75 0 0 1-1.75 1.75h-9.5A1.75 1.75 0 0 1 1.5 12.75v-9.5A1.75 1.75 0 0 1 3.25 1.5zm1.5 3.25a.75.75 0 0 0 0 1.5h6.5a.75.75 0 0 0 0-1.5h-6.5zm0 2.75a.75.75 0 0 0 0 1.5h6.5a.75.75 0 0 0 0-1.5h-6.5zm0 2.75a.75.75 0 0 0 0 1.5h4a.75.75 0 0 0 0-1.5h-4z"/></svg>
                </button>
            </div>
            <div class="toolbar-separator"></div>
            <!-- Group 1: File -->
            <div class="toolbar-group">
                <button class="toolbar-btn icon-btn" id="btn-new" data-tooltip="New" data-shortcut="N">
                    <svg width="16" height="16" viewBox="0 0 16 16"><path fill="currentColor" d="M3 2.5A1.5 1.5 0 0 1 4.5 1H9v4a1 1 0 0 0 1 1h4v7.5A1.5 1.5 0 0 1 12.5 15h-8A1.5 1.5 0 0 1 3 13.5v-11zM10 1.25 13.75 5H10.5a.5.5 0 0 1-.5-.5V1.25z"/></svg>
                </button>
                <button class="toolbar-btn icon-btn" id="btn-open" data-tooltip="Open" data-shortcut="O">
                    <svg width="16" height="16" viewBox="0 0 16 16"><path fill="currentColor" d="M1.5 4.25A1.75 1.75 0 0 1 3.25 2.5h2.7c.4 0 .77.13 1.07.38l1.13.94h6.6A1.75 1.75 0 0 1 16.5 5.57v.18H1.5V4.25zM1.5 6.75h13l-.95 5.7a1.75 1.75 0 0 1-1.73 1.55H4.18a1.75 1.75 0 0 1-1.73-1.55L1.5 6.75z"/></svg>
                </button>
                <button class="toolbar-btn icon-btn" id="btn-save" data-tooltip="Save" data-shortcut="S">
                    <svg width="16" height="16" viewBox="0 0 16 16"><path fill="currentColor" fill-rule="evenodd" d="M2.5 2.75A1.25 1.25 0 0 1 3.75 1.5h7.6L14 4.15v9.1a1.25 1.25 0 0 1-1.25 1.25H3.75A1.25 1.25 0 0 1 2.5 13.25V2.75zM5 2.5v3h5V2.5H5zm-.5 6.75v4h7v-4h-7z"/></svg>
                </button>
                <button class="toolbar-btn icon-btn" id="btn-export-pdf" data-tooltip="Export PDF" data-shortcut="P">
                    <svg width="16" height="16" viewBox="0 0 16 16"><path fill="currentColor" fill-rule="evenodd" d="M3 2.5A1.5 1.5 0 0 1 4.5 1H10v4a1 1 0 0 0 1 1h4v7.5A1.5 1.5 0 0 1 13.5 15h-9A1.5 1.5 0 0 1 3 13.5v-11zM11 1.25 14.75 5H11.5a.5.5 0 0 1-.5-.5V1.25zM5.5 8.75a.6.6 0 0 0 0 1.2h4a.6.6 0 0 0 0-1.2h-4zm0 2.25a.6.6 0 0 0 0 1.2h3a.6.6 0 0 0 0-1.2h-3z"/></svg>
                </button>
            </div>
            <div class="toolbar-separator"></div>
            <!-- Group 2: Inline Styles -->
            <div class="toolbar-group">
                <button class="toolbar-btn icon-btn format-btn" id="btn-bold" data-tooltip="Bold" data-shortcut="B">
                    <svg width="16" height="16" viewBox="0 0 16 16"><text x="3.2" y="13" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="900" fill="currentColor">B</text></svg>
                </button>
                <button class="toolbar-btn icon-btn format-btn" id="btn-italic" data-tooltip="Italic" data-shortcut="I">
                    <svg width="16" height="16" viewBox="0 0 16 16"><text x="4" y="13" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-weight="700" font-style="italic" fill="currentColor">I</text></svg>
                </button>
                <button class="toolbar-btn icon-btn format-btn" id="btn-strike" data-tooltip="Strikethrough" data-shortcut="shift+X">
                    <svg width="16" height="16" viewBox="0 0 16 16"><text x="3.5" y="13" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="800" fill="currentColor">S</text><rect x="2" y="7.5" width="12" height="1.5" rx="0.5" fill="currentColor"/></svg>
                </button>
                <button class="toolbar-btn icon-btn format-btn" id="btn-code" data-tooltip="Inline Code">
                    <svg width="16" height="16" viewBox="0 0 16 16"><path fill="currentColor" d="M5.5 4.2a.85.85 0 0 0-1.2 0L1.5 7l2.8 2.8a.85.85 0 1 0 1.2-1.2L3.7 7l1.8-1.6a.85.85 0 0 0 0-1.2zm5 0a.85.85 0 0 1 1.2 0L14.5 7l-2.8 2.8a.85.85 0 1 1-1.2-1.2L12.3 7l-1.8-1.6a.85.85 0 0 1 0-1.2zM9 2.8 6.4 13.1a.85.85 0 1 1-1.65-.4L7.35 2.4a.85.85 0 1 1 1.65.4z"/></svg>
                </button>
                <button class="toolbar-btn icon-btn" id="btn-link" data-tooltip="Insert Link" data-shortcut="K">
                    <svg width="16" height="16" viewBox="0 0 16 16"><path fill="currentColor" d="M6.4 9.2a.85.85 0 0 1 0-1.2l1.6-1.6a.85.85 0 1 1 1.2 1.2L7.6 9.2a.85.85 0 0 1-1.2 0zm-.6-3a3 3 0 0 1 4.25 0l.45.4a.85.85 0 1 1-1.2 1.2l-.4-.45a1.3 1.3 0 0 0-1.85 0L4.7 9.7a1.3 1.3 0 1 0 1.85 1.85l.6-.6a.85.85 0 1 1 1.2 1.2l-.6.6A3 3 0 0 1 3.5 8.5l2.3-2.3zm5.55 5.55a3 3 0 0 1-4.25 0l-.4-.4a.85.85 0 1 1 1.2-1.2l.4.4a1.3 1.3 0 0 0 1.85 0L12.5 8.05a1.3 1.3 0 1 0-1.85-1.85l-.6.6a.85.85 0 1 1-1.2-1.2l.6-.6a3 3 0 0 1 4.25 4.25l-2.35 2.35z"/></svg>
                </button>
            </div>
            <div class="toolbar-separator"></div>
            <!-- Group 3: Block Styles -->
            <div class="toolbar-group">
                <!-- Heading dropdown trigger -->
                <div class="dropdown" id="heading-dropdown">
                    <button class="toolbar-btn icon-btn dropdown-toggle" id="btn-heading" data-tooltip="Headings">
                        <svg width="16" height="16" viewBox="0 0 16 16"><text x="1" y="13" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="900" fill="currentColor">T</text><text x="9" y="13" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="9" font-weight="800" fill="currentColor">t</text></svg>
                    </button>
                    <div class="dropdown-menu" id="heading-menu">
                        <button class="dropdown-item" id="btn-h1" data-shortcut="1">Heading 1</button>
                        <button class="dropdown-item" id="btn-h2" data-shortcut="2">Heading 2</button>
                        <button class="dropdown-item" id="btn-h3" data-shortcut="3">Heading 3</button>
                    </div>
                </div>
                <button class="toolbar-btn icon-btn" id="btn-quote" data-tooltip="Blockquote">
                    <svg width="16" height="16" viewBox="0 0 16 16"><path fill="currentColor" d="M2 2.5h2v11H2v-11zm4 2.5h8v1.6H6V5zm0 3.2h8v1.6H6V8.2zm0 3.2h6v1.6H6v-1.6z"/></svg>
                </button>
                <button class="toolbar-btn icon-btn" id="btn-bullet" data-tooltip="Bullet List" data-shortcut="shift+8">
                    <svg width="16" height="16" viewBox="0 0 16 16"><path fill="currentColor" d="M3 4a1.4 1.4 0 1 1-2.8 0A1.4 1.4 0 0 1 3 4zm0 4a1.4 1.4 0 1 1-2.8 0A1.4 1.4 0 0 1 3 8zm0 4a1.4 1.4 0 1 1-2.8 0A1.4 1.4 0 0 1 3 12zm3-7.8h8.6a.8.8 0 1 1 0 1.6H6a.8.8 0 0 1 0-1.6zm0 3.2h8.6a.8.8 0 1 1 0 1.6H6a.8.8 0 0 1 0-1.6zm0 3.2h8.6a.8.8 0 1 1 0 1.6H6a.8.8 0 0 1 0-1.6z"/></svg>
                </button>
                <button class="toolbar-btn icon-btn" id="btn-numlist" data-tooltip="Numbered List">
                    <svg width="16" height="16" viewBox="0 0 16 16"><text x="0" y="5.6" font-size="5.2" font-weight="800" fill="currentColor" font-family="-apple-system, sans-serif">1</text><text x="0" y="9.8" font-size="5.2" font-weight="800" fill="currentColor" font-family="-apple-system, sans-serif">2</text><text x="0" y="14" font-size="5.2" font-weight="800" fill="currentColor" font-family="-apple-system, sans-serif">3</text><path fill="currentColor" d="M5.5 3.4h9a.8.8 0 1 1 0 1.6h-9a.8.8 0 0 1 0-1.6zm0 4.2h9a.8.8 0 1 1 0 1.6h-9a.8.8 0 0 1 0-1.6zm0 4.2h9a.8.8 0 1 1 0 1.6h-9a.8.8 0 0 1 0-1.6z"/></svg>
                </button>
                <button class="toolbar-btn icon-btn" id="btn-task" data-tooltip="Task List">
                    <svg width="16" height="16" viewBox="0 0 16 16"><path fill="currentColor" fill-rule="evenodd" d="M2 3.6A1.6 1.6 0 0 1 3.6 2h2.8A1.6 1.6 0 0 1 8 3.6v2.8A1.6 1.6 0 0 1 6.4 8H3.6A1.6 1.6 0 0 1 2 6.4V3.6zm4.85.45a.75.75 0 0 0-1.2-.9L4.4 4.85l-.5-.55a.75.75 0 1 0-1.1 1.02l1.1 1.2a.75.75 0 0 0 1.15-.06l1.8-2.4zM9.5 4.4h5a.8.8 0 1 1 0 1.6h-5a.8.8 0 0 1 0-1.6zM2 11A1.6 1.6 0 0 1 3.6 9.4h2.8A1.6 1.6 0 0 1 8 11v2.4A1.6 1.6 0 0 1 6.4 15H3.6A1.6 1.6 0 0 1 2 13.4V11zm7.5.8h5a.8.8 0 1 1 0 1.6h-5a.8.8 0 0 1 0-1.6z"/></svg>
                </button>
                <button class="toolbar-btn icon-btn" id="btn-codeblock" data-tooltip="Code Block" data-shortcut="shift+C">
                    <svg width="16" height="16" viewBox="0 0 16 16"><path fill="currentColor" fill-rule="evenodd" d="M2.5 2A1.5 1.5 0 0 0 1 3.5v9A1.5 1.5 0 0 0 2.5 14h11a1.5 1.5 0 0 0 1.5-1.5v-9A1.5 1.5 0 0 0 13.5 2h-11zm3 4.3a.75.75 0 0 0-1.05-1.1L2.8 6.95a.75.75 0 0 0 0 1.1l1.65 1.65a.75.75 0 0 0 1.05-1.05L4.4 7.5l1.1-1.2zm5-1.1a.75.75 0 0 1 1.05 0l1.65 1.75a.75.75 0 0 1 0 1.1l-1.65 1.65a.75.75 0 0 1-1.05-1.05L11.6 7.5l-1.1-1.2a.75.75 0 0 1 0-1.1zM9 5l-2 5.5a.6.6 0 1 1-1.14-.4L7.86 4.6A.6.6 0 1 1 9 5z"/></svg>
                </button>
                <button class="toolbar-btn icon-btn" id="btn-table" data-tooltip="Insert Table">
                    <svg width="16" height="16" viewBox="0 0 16 16"><path fill="currentColor" fill-rule="evenodd" d="M2 3.5A1.5 1.5 0 0 1 3.5 2h9A1.5 1.5 0 0 1 14 3.5V6H2V3.5zM2 7.4h4.2v3.2H2V7.4zm5.4 0h3.2v3.2H7.4V7.4zm4.4 0H14v3.2h-2.2V7.4zM2 12h4.2v2H3.5A1.5 1.5 0 0 1 2 12.5V12zm5.4 0h3.2v2H7.4v-2zm4.4 0H14v.5a1.5 1.5 0 0 1-1.5 1.5H11.8v-2z"/></svg>
                </button>
                <button class="toolbar-btn icon-btn" id="btn-image" data-tooltip="Insert Image">
                    <svg width="16" height="16" viewBox="0 0 16 16"><path fill="currentColor" fill-rule="evenodd" d="M2 3.5A1.5 1.5 0 0 1 3.5 2h9A1.5 1.5 0 0 1 14 3.5v6.13L11 6.7l-3.2 3.6L6 8.5 2 12.4V3.5zm0 9.1V12.5A1.5 1.5 0 0 0 3.5 14h9a1.5 1.5 0 0 0 1.5-1.5v-.7l-3-3-3.2 3.6L6 10.7 2 12.6zM5.6 6.2a1.3 1.3 0 1 1-2.6 0 1.3 1.3 0 0 1 2.6 0z"/></svg>
                </button>
            </div>
        </div>
        <!-- Pinned right group — always visible, overlaps left content when narrow -->
        <div class="toolbar-separator toolbar-separator-pinned"></div>
        <div class="toolbar-group toolbar-group-pinned">
            <button class="toolbar-btn icon-btn" id="btn-page-view" data-tooltip="Page View">
                <svg width="16" height="16" viewBox="0 0 16 16"><path fill="currentColor" fill-rule="evenodd" d="M4.5 1A1.5 1.5 0 0 0 3 2.5v10A1.5 1.5 0 0 0 4.5 14h6a1.5 1.5 0 0 0 1.5-1.5v-10A1.5 1.5 0 0 0 10.5 1h-6zm.9 3.4a.7.7 0 1 0 0 1.4h4.2a.7.7 0 1 0 0-1.4H5.4zm0 2.6a.7.7 0 1 0 0 1.4h4.2a.7.7 0 1 0 0-1.4H5.4zm0 2.6a.7.7 0 1 0 0 1.4h2.6a.7.7 0 1 0 0-1.4H5.4z" opacity="0.95"/><path fill="currentColor" d="M13 4v9.5A1.5 1.5 0 0 1 11.5 15H6" opacity="0.35"/></svg>
            </button>
            <button class="toolbar-btn icon-btn" id="btn-read-accent" data-tooltip="Reading Accent">
                <svg width="16" height="16" viewBox="0 0 16 16"><path fill="currentColor" d="M6.4 3a.8.8 0 0 1 .75.52l3.4 9a.8.8 0 1 1-1.5.56L8.3 11H4.5l-.75 2.08a.8.8 0 1 1-1.5-.56l3.4-9A.8.8 0 0 1 6.4 3zm-1.32 6.4h2.64L6.4 5.78 5.08 9.4z"/><circle cx="12.5" cy="3.5" r="1.5" fill="currentColor"/></svg>
            </button>
            <button class="toolbar-btn icon-btn" id="btn-comments" data-tooltip="Comments" data-shortcut="shift+K">
                <svg width="16" height="16" viewBox="0 0 16 16"><path fill="currentColor" d="M2.5 2A1.5 1.5 0 0 0 1 3.5v6A1.5 1.5 0 0 0 2.5 11H4v2.6c0 .42.5.62.78.31L7.5 11h6A1.5 1.5 0 0 0 15 9.5v-6A1.5 1.5 0 0 0 13.5 2h-11z"/></svg>
            </button>
        </div>
    </div>

    <!-- Tab Bar -->
    <div class="tab-bar" id="tab-bar">
        <div class="tabs-container"></div>
    </div>

    <!-- Find Bar -->
    <div class="find-bar hidden" id="find-bar">
        <div class="find-row">
            <button class="find-toggle" id="toggle-replace" title="Toggle Replace">▶</button>
            <input type="text" class="find-input" id="find-input" placeholder="Find...">
            <label class="find-option" title="Case Sensitive (Alt+C)">
                <input type="checkbox" id="find-case-sensitive">
                <span>Aa</span>
            </label>
            <span class="find-count" id="find-count"></span>
            <button class="find-btn" id="find-prev" title="Previous Match (Shift+Enter)">↑</button>
            <button class="find-btn" id="find-next" title="Next Match (Enter)">↓</button>
            <button class="find-btn find-close" id="find-close" title="Close (Esc)">×</button>
        </div>
        <div class="replace-row hidden" id="replace-row">
            <input type="text" class="find-input" id="replace-input" placeholder="Replace with...">
            <button class="find-btn" id="replace-btn" title="Replace">Replace</button>
            <button class="find-btn" id="replace-all-btn" title="Replace All">All</button>
        </div>
    </div>

    <!-- Editor Container -->
    <div class="editor-container" id="editor-container">
        <div class="recent-panel hidden" id="recent-panel">
            <div class="recent-header">
                <span class="recent-title">Recent Files</span>
                <button class="recent-close" id="recent-close">&times;</button>
            </div>
            <div class="recent-content" id="recent-content"></div>
        </div>
        <div id="editor"></div>
    </div>

    <!-- Status Bar -->
    <div class="statusbar" id="statusbar">
        <span class="status-item" id="status-position">Ln 1, Col 1</span>
        <span class="status-separator">|</span>
        <span class="status-item" id="status-encoding">UTF-8</span>
        <span class="status-separator">|</span>
        <span class="status-item" id="status-words">Words: 0</span>
        <span class="status-separator">|</span>
        <span class="status-item" id="status-reading-time">~0 min read</span>
        <span class="status-spacer"></span>
        <span class="status-item" id="status-message"></span>
        <div class="status-controls">
            <button class="status-btn" id="btn-zoom-out">−</button>
            <span class="status-item" id="font-size-label">14px</span>
            <button class="status-btn" id="btn-zoom-in">+</button>
            <span class="status-separator">|</span>
            <button class="status-btn" id="btn-theme" title="Toggle Theme">☀</button>
        </div>
    </div>

    <!-- Toast Notifications -->
    <div class="toast-container" id="toast-container"></div>

    <!-- Modal Dialog -->
    <div class="modal-overlay hidden" id="modal-overlay">
        <div class="modal-dialog" id="modal-dialog">
            <div class="modal-message" id="modal-message"></div>
            <div class="modal-buttons" id="modal-buttons"></div>
        </div>
    </div>

    <!-- Load bundled JavaScript -->
    <script src="js/bundle.js"></script>
</body>
</html>
